; PlatformIO Project Configuration File for ESP32 Cruise Control & CAN Sniffer
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_TWAI_ISR_IN_IRAM=1
    -Iinclude
build_src_filter = +<*> -<sniffer_main.cpp>

lib_deps =
    ; Zero third-party bloat: Built with native ESP-IDF TWAI (CAN) & Wire I2C

[env:can_sniffer]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_TWAI_ISR_IN_IRAM=1
build_src_filter = +<sniffer_main.cpp>
lib_deps = 
    autowp/autowp-mcp2515 @ ^1.3.1


